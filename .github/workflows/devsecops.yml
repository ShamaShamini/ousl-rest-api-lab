
name: AWS DevSecOps Pipeline

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-secure:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up JDK 17
      - name: Set up JDK 17
       uses: actions/setup-java@v5
       with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: student-service/pom.xml

      # 3. SonarCloud SAST Scan
      - name: SonarCloud SAST Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=ousl-student-service

      # 4. Build Docker Image
      - name: Build Container
        run: |
          docker build -t ousl-student-api:${{ github.sha }} .

      # 5. Aqua Security Trivy Scan
      - name: Aqua Security Trivy Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ousl-student-api:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL

      # 6. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # 7. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 8. Tag Docker Image
      - name: Tag Docker Image
        run: |
          docker tag ousl-student-api:${{ github.sha }} \
          ${{ steps.login-ecr.outputs.registry }}/ousl-student-api:${{ github.sha }}

      # 9. Push Docker Image to ECR
      - name: Push Image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/ousl-student-api:${{ github.sha }}
