
name: AWS DevSecOps Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-secure:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # 3. Build and test Spring Boot project
      - name: Build Spring Boot Application
        working-directory: student-service
        run: mvn -B clean verify

      # 4. SonarQube Cloud analysis
      - name: SonarQube Cloud Analysis
        working-directory: student-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization=shamashamini \
            -Dsonar.projectKey=ShamaShamini_ousl-rest-api-lab \
            -Dsonar.qualitygate.wait=true

      # 5. Build Docker image
      - name: Build Docker Container
        working-directory: student-service
        run: |
          docker build -f Dockerfile \
            -t ousl-student-api:${{ github.sha }} .

      # 6. Trivy vulnerability scan
      - name: Aqua Security Trivy Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ousl-student-api:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM,LOW

      # 7. Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      # 8. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 9. Tag Docker image
      - name: Tag Docker Image
        run: |
          docker tag ousl-student-api:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/ousl-student-api:${{ github.sha }}

      # 10. Push image to Amazon ECR
      - name: Push Docker Image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/ousl-student-api:${{ github.sha }}

      # 11. Verify ECR image
      - name: Verify ECR Image
        run: |
          aws ecr describe-images \
            --repository-name ousl-student-api \
            --region ap-south-2

       
