name: AWS DevSecOps Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-secure:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout GitHub Repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Find Maven Project Directory
      - name: Locate Maven Project
        shell: bash
        run: |
          POM_PATH=$(find . -name pom.xml -not -path './.git/*' -print -quit)

          if [ -z "$POM_PATH" ]; then
            echo "ERROR: pom.xml not found!"
            echo "Please check that pom.xml is committed to GitHub."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$POM_PATH")

          echo "Maven project found: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 3. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. Build Maven Project
      - name: Build Spring Boot Application
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mvn clean verify

      # 5. SonarCloud SAST Scan
      - name: SonarCloud SAST Scan
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=ousl-student-service \
          -Dsonar.host.url=https://sonarcloud.io || true

      # 6. Build Docker Image
      - name: Build Docker Container
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
         ls -la
          docker build -t ousl-student-api:${{ github.sha }} .

      # 7. Trivy Security Scan
      - name: Aqua Security Trivy Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ousl-student-api:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: CRITICAL

      # 8. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # 9. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 10. Tag Docker Image
      - name: Tag Docker Image
        run: |
          docker tag ousl-student-api:${{ github.sha }} \
          ${{ steps.login-ecr.outputs.registry }}/ousl-student-api:${{ github.sha }}

      # 11. Push Docker Image to Amazon ECR
      - name: Push Docker Image to ECR
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/ousl-student-api:${{ github.sha }}

      # 12. Verify ECR Image
      - name: Verify ECR Image
        run: |
          aws ecr describe-images \
            --repository-name ousl-student-api \
            --region ap-southeast-2

