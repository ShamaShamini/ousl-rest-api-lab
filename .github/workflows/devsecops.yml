name: AWS DevSecOps Pipeline

on:
  push:
    branches: ["main"]
  # Optional: also run on pull requests so issues are caught before merge.
  # pull_request:
  #   branches: ["main"]

# Least-privilege token permissions (DevSecOps best practice).
permissions:
  contents: read

env:
  IMAGE_NAME: ousl-student-api
  ECR_REPOSITORY: ousl-student-service
  # AWS region used by every AWS step. Override by adding an AWS_REGION secret.
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}

jobs:
  build-and-secure:
    runs-on: ubuntu-latest
    defaults:
      run:
        # CORRECTED from "ousl-project" to match the real folder name in your repo.
        working-directory: student-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history -> SonarCloud blame / new-code detection

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven      # cache ~/.m2 -> faster builds

      # ---- SAST: SonarCloud ----
      # `|| true` keeps Sonar non-blocking. Remove it to let the SonarCloud
      # quality gate fail the build.
      - name: SonarCloud SAST Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn verify sonar:sonar \
            -Dsonar.projectKey=ousl-student-service \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            || true

      # ---- Build container image ----
      - name: Build Container
        run: docker build -t "$IMAGE_NAME:$GITHUB_SHA" .

      # ---- Container vulnerability scan ----
      # exit-code: '0' = non-blocking. Change to '1' to fail the build when
      # CRITICAL CVEs are found.
      - name: Aqua Security Trivy Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL'

      # ---- AWS authentication ----
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ---- ECR login ----
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      # ---- Push image to ECR ----
      - name: Tag and Push Image to ECR
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "::notice::Pushed $REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

      # ---- Optional: deploy ----
      # Uncomment and adapt to your target (ECS / App Runner / Beanstalk / EC2).
      # - name: Deploy to ECS
      #   run: |
      #     aws ecs update-service \
      #       --cluster ousl-cluster \
      #       --service ousl-student-service \
      #       --force-new-deployment
